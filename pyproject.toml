[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "norman-utils-external"
description = "norman utils common classes"
version = "0.0.1"
authors = [
    {name = "Norman Artificial Intelligence LTD", email = "yonatan.alon@norman-ai.com"},
]

requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
    "norman-exceptions",
    "norman-objects",

    "cryptography==46.0.5"
]

[tool.flit.module]
name = "norman_utils_external"

[tool.uv]
override-dependencies = [
    "norman-exceptions @ git+https://github.com/norman-ml/norman_exceptions.git@main",
    "norman-objects @ git+https://github.com/norman-ml/norman_objects.git@main"
]
