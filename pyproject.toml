[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "norman-utils"
description = "norman utils common classes"
version = "0.0.1"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Norman Artificial Intelligence LTD", email = "contact@norman-ai.com"},
]

requires-python = ">=3.9"
dependencies = [
    "norman-exceptions",
    "norman-objects",

    "cryptography==46.0.5"
]

[project.optional-dependencies]
dev = [
    # Intentional boilerplate (for build scripts)
]

[tool.flit.module]
name = "norman_utils"

[tool.uv]
override-dependencies = [
    "norman-exceptions @ git+https://github.com/norman-ml/norman_exceptions.git@main",
    "norman-objects @ git+https://github.com/norman-ml/norman_objects.git@main"
]
